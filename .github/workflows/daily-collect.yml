name: Daily Collect

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install httpx loguru pydantic python-dotenv

      - name: Run collection pipeline
        run: python .opencode/pipeline/pipeline.py --sources github,rss --limit 20 --verbose
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate JSON
        run: python hooks/validate_json.py --dir knowledge/raw/
        continue-on-error: true

      - name: Check quality
        run: python hooks/check_quality.py knowledge/articles/*.json --summary
        continue-on-error: true

      - name: Commit and push
        run: |
          DATE=$(date +%Y-%m-%d)
          TOTAL_KEPT=0
          for f in knowledge/articles/summary-*-${DATE}.json; do
            if [ -f "$f" ]; then
              KEPT=$(python -c "import json; d=json.load(open('$f')); print(d.get('kept', 0))")
              TOTAL_KEPT=$((TOTAL_KEPT + KEPT))
            fi
          done

          if [ "$TOTAL_KEPT" -gt 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add knowledge/
            git commit -m "daily: ${TOTAL_KEPT} articles (${DATE})"
            git push
          else
            echo "No new articles collected, skipping commit"
          fi
